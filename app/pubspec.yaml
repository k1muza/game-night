name: game_night
description: "Game Night — single-device party games (30-Second Sprint, Charades, Trivia Challenge, Tabuu)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.3

dependencies:
  audioplayers: ^6.7.1
  connectivity_plus: ^7.3.1
  crypto: ^3.0.8
  flutter:
    sdk: flutter
  mobile_scanner: ^7.5.0
  package_info_plus: ^10.2.2
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.6
  wakelock_plus: ^1.7.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/decks/meta.json
    - assets/decks/sprint.json
    - assets/decks/charades.json
    - assets/decks/trivia.json
    - assets/decks/forbidden.json
  fonts:
    - family: Bricolage Grotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-Bold.ttf
          weight: 700
        - asset: assets/fonts/BricolageGrotesque-ExtraBold.ttf
          weight: 800
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
